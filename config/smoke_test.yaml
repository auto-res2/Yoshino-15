# config/smoke_test.yaml
name: "Experiment-1-Smoke"
description: |
  Smoke-test version of Experiment-1. Runs on 50 examples of the IMDB dataset
  (read from the public "imdb" Hub repo) with one model (PRANCE) and a single
  decoding configuration. The goal is to validate that the entire pipeline—
  dataset resolution, model load, evaluation, plotting and JSON output—works
  end-to-end while consuming minimal compute.
datasets:
  IMDB:
    hf_repo: "imdb"
models:
  PRANCE:
    hf_id: "facebook/opt-125m"
    8bit: false
    lora: false
training:
  batch: 1
  lr: 1e-5
  grad_accum: 1
  epochs: 1
  seeds: [11]
evaluation:
  attack_set: "IMDB"
  attack_split: "test"
  temperature: 0.8
  top_p: 0.95
  bad_keywords: ["bad", "terrible", "awful"]
plotting: {}
