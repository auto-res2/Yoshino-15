# config/smoke_test.yaml
name: "Experiment-1-Smoke"
description: |
  Smoke-test version of Experiment-1. Runs on 50 examples of HarmBench only, one
  model (PRANCE) and one decoding configuration to validate that the entire
  pipeline, plotting and JSON output work end-to-end while consuming minimal
  compute.
datasets:
  HarmBench:
    hf_repo: "HuggingFaceH4/harmbench"
models:
  PRANCE:
    hf_id: "facebook/opt-125m"
    8bit: false
    lora: false
training:
  batch: 1
  lr: 1e-5
  grad_accum: 1
  epochs: 1
  seeds: [11]
evaluation:
  attack_set: "HarmBench"
  attack_split: "test"
  temperature: 0.8
  top_p: 0.95
  bad_keywords: ["attack succeeded", "harm"]
plotting: {}
