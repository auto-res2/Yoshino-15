# config/full_experiment.yaml
name: "Prompt-Level Robustness & Shallow-Alignment Hole Closure"
description: |
  Full implementation of Experiment-1 as described in the method section. It
  evaluates PRANCE and four baselines over multiple decoding conditions and
  attack corpora. The configuration below captures ONLY the portion needed by
  this executable code – the remainder of the experimental details (e.g., human
  audit, GPT-4 judge) is handled offline.
datasets:
  AdvBench:
    hf_repo: "MBZUAI/AdvBenchmark"
    config: "default"
  HarmBench:
    hf_repo: "HuggingFaceH4/harmbench"
  JailbreakBench:
    hf_repo: "HuggingFaceH4/jailbreakbench"
  MTBench:
    hf_repo: "lmsys/mt_bench"
  PKU_SafeRLHF:
    hf_repo: "PKU-Alignment/PKU-SafeRLHF"
models:
  PRANCE:
    hf_id: "meta-llama/Meta-Llama-3-8B-Instruct"
    8bit: false
    lora: true
    lora_r: 16
    training: "PKU_SafeRLHF"
    eval: "PKU_SafeRLHF"
  Constitutional:
    hf_id: "meta-llama/Meta-Llama-3-8B-Instruct"
    8bit: true
    lora: false
training:
  batch: 2
  lr: 2e-5
  grad_accum: 4
  epochs: 1
  seeds: [11, 17, 23, 29, 31]
evaluation:
  attack_set: "AdvBench"
  temperature: 0.8
  top_p: 0.95
  bad_keywords: ["harmful", "jailbreak", "kill", "attack succeeded"]
plotting: {}
