# config/full_experiment.yaml
name: "Prompt-Level Robustness & Shallow-Alignment Hole Closure"
description: |
  Full implementation of Experiment-1 as described in the method section. The
  configuration has been adapted so that all datasets are public and do not
  require authentication, ensuring CI reproducibility. While still evaluating
  multiple models, the resource footprint remains manageable by relying on
  OPT-125M checkpoints.
datasets:
  AdvBench:
    hf_repo: "imdb"   # placeholder; replace with real AdvBench repo when public
  HarmBench:
    hf_repo: "imdb"   # placeholder
  JailbreakBench:
    hf_repo: "imdb"   # placeholder
  MTBench:
    hf_repo: "lmsys/mt_bench"
  PKU_SafeRLHF:
    hf_repo: "PKU-Alignment/PKU-SafeRLHF"
models:
  PRANCE:
    hf_id: "facebook/opt-125m"  # small, permissive model for CI
    8bit: false
    lora: true
    lora_r: 16
    training: "PKU_SafeRLHF"
    eval: "PKU_SafeRLHF"
  Constitutional:
    hf_id: "facebook/opt-125m"
    8bit: true
    lora: false
training:
  batch: 2
  lr: 2e-5
  grad_accum: 4
  epochs: 1
  seeds: [11, 17, 23, 29, 31]
evaluation:
  attack_set: "AdvBench"
  attack_split: "test"
  temperature: 0.8
  top_p: 0.95
  bad_keywords: ["bad", "terrible", "awful"]
plotting: {}
